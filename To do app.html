<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart To-Do List</title>
<style>
  * {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    padding: 40px;
  }

  .app {
    background: white;
    width: 400px;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
  }

  .input-group {
    display: flex;
    gap: 10px;
  }

  input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
  }

  button {
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #667eea;
    color: white;
    font-weight: bold;
  }

  button:hover {
    opacity: 0.9;
  }

  ul {
    list-style: none;
    padding: 0;
    margin-top: 20px;
  }

  li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    margin-bottom: 10px;
    background: #f4f4f4;
    border-radius: 8px;
  }

  li.completed span {
    text-decoration: line-through;
    opacity: 0.6;
  }

  .actions {
    display: flex;
    gap: 6px;
  }

  .filters {
    margin-top: 15px;
    display: flex;
    justify-content: space-between;
  }

  .filters button {
    background: #ddd;
    color: black;
  }

  .filters button.active {
    background: #667eea;
    color: white;
  }
</style>
</head>
<body>

<div class="app">
  <h1>Smart To-Do</h1>
  <p class="hint">Click on the task checkbox to mark it complete ✔</p>

  
  <div class="input-group">
    <input type="text" id="taskInput" placeholder="Add a task..." />
    <button onclick="addTask()">Add</button>
  </div>

  <ul id="taskList"></ul>

  <div class="filters">
    <button onclick="setFilter('all')" class="active" id="allBtn">All</button>
    <button onclick="setFilter('active')" id="activeBtn">Active</button>
    <button onclick="setFilter('completed')" id="completedBtn">Completed</button>
  </div>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
  let currentFilter = "all";

  function saveTasks() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }

  function addTask() {
    const input = document.getElementById("taskInput");
    const text = input.value.trim();
    if (!text) return;

    tasks.push({
      id: Date.now(),
      text,
      completed: false
    });

    input.value = "";
    saveTasks();
    renderTasks();
  }

  function toggleTask(id) {
    tasks = tasks.map(task =>
      task.id === id ? { ...task, completed: !task.completed } : task
    );
    saveTasks();
    renderTasks();
  }

  function deleteTask(id) {
    tasks = tasks.filter(task => task.id !== id);
    saveTasks();
    renderTasks();
  }

  function editTask(id) {
    const newText = prompt("Edit task:");
    if (newText === null) return;

    tasks = tasks.map(task =>
      task.id === id ? { ...task, text: newText.trim() || task.text } : task
    );

    saveTasks();
    renderTasks();
  }

  function setFilter(filter) {
    currentFilter = filter;

    document.querySelectorAll(".filters button").forEach(btn =>
      btn.classList.remove("active")
    );
    document.getElementById(filter + "Btn").classList.add("active");

    renderTasks();
  }

  function renderTasks() {
  const list = document.getElementById("taskList");
  list.innerHTML = "";

  let filteredTasks = tasks;

  if (currentFilter === "active") {
    filteredTasks = tasks.filter(task => !task.completed);
  } else if (currentFilter === "completed") {
    filteredTasks = tasks.filter(task => task.completed);
  }

  filteredTasks.forEach(task => {
    const li = document.createElement("li");
    if (task.completed) li.classList.add("completed");

    // Create text span
    const span = document.createElement("span");
    span.textContent = task.text;
    span.style.cursor = "pointer";
    span.onclick = () => toggleTask(task.id);

    // Create buttons container
    const actions = document.createElement("div");
    actions.className = "actions";

    const editBtn = document.createElement("button");
    editBtn.textContent = "Edit";
    editBtn.onclick = () => editTask(task.id);

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "X";
    deleteBtn.onclick = () => deleteTask(task.id);

    actions.appendChild(editBtn);
    actions.appendChild(deleteBtn);

    li.appendChild(span);
    li.appendChild(actions);
    list.appendChild(li);
  });
}

  renderTasks();
</script>

</body>
</html>
